name: Build test ROM

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - upcoming
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GBA toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            libelf-dev

      - name: Build ROM
        env:
          COMPARE: 0
        run: make -j"$(nproc)" -O all

      - name: Upload test ROM
        uses: actions/upload-artifact@v4
        with:
          name: emerald-imperium-test-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald.map
          if-no-files-found: error
          retention-days: 14

      - name: Test
        env:
          TEST: 1
        run: |
          make -j"$(nproc)" check
