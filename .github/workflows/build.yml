name: Build and release ROM

on:
  workflow_dispatch:
  push:
    branches:
      - imperium-custom
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GBA toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            libelf-dev

      - name: Preserve committed Poryscript output
        run: |
          find data -name '*.pory' -print0 | while IFS= read -r -d '' source; do
            generated="${source%.pory}.inc"
            if [[ -f "$generated" ]]; then
              touch "$generated"
            fi
          done

      - name: Build ROM
        run: make -j"$(nproc)" -O all

      - name: Upload test ROM
        uses: actions/upload-artifact@v4
        with:
          name: emerald-imperium-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald.map
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref_name == 'imperium-custom'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: imperium-custom-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            pokeemerald.gba \
            pokeemerald.map \
            --target "$GITHUB_SHA" \
            --title "Emerald Imperium custom build ${{ github.run_number }}" \
            --notes "Automated personal build from commit $GITHUB_SHA." \
            --prerelease
